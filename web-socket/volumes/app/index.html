<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>WebSocket Test</title>
</head>
<body>
  <h1>WebSocket テスト画面</h1>
  <button id="connectBtn">1. WebSocket接続を開始</button>
  <button id="disconnectBtn">2. WebSocket切断</button>

  <script>
    let socket = null;
    let clientIntervalId = null;

    // 接続ボタン
    document.getElementById('connectBtn').addEventListener('click', () => {
      if (socket && socket.readyState === WebSocket.OPEN) {
        console.log('すでに接続されています');
        return;
      }

      const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${wsProtocol}//${location.host}`);

      socket.onopen = () => {
        console.log('WebSocket接続が確立しました');

        // クライアントから2秒ごとに現在時刻を送信
        clientIntervalId = setInterval(() => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            const now = new Date().toLocaleTimeString('ja-JP');
            socket.send(`[クライアント時刻] ${now}`);
          }
        }, 2000);
      };

      socket.onmessage = (event) => {
        console.log('サーバーから受信:', event.data);
      };

      socket.onclose = () => {
        console.log('WebSocket接続が切断されました');
        // クライアント側のタイマーを停止
        if (clientIntervalId) {
          clearInterval(clientIntervalId);
          clientIntervalId = null;
        }
      };

      socket.onerror = (error) => {
        console.error('WebSocketエラー:', error);
      };
    });

    // 切断ボタン
    document.getElementById('disconnectBtn').addEventListener('click', () => {
      if (socket) {
        socket.close();
        socket = null;
      } else {
        console.log('接続されていません');
      }
    });
  </script>
</body>
</html>
